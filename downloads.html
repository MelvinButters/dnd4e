<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Downloads - D&D 4E</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="navbar"></div>

<div class="container">
  <h1>Downloads</h1>
  <p>Access official and fan-created resources. Files are hosted on GitHub for easy access.</p>

  <!-- Player Handbook -->
  <div class="download-box">
    <h2>Player Handbook</h2>
    <ul class="download-list">
      <li><a href="https://github.com/username/dnd4e-files/raw/main/Player-Handbook.pdf" target="_blank">Download PDF</a></li>
    </ul>
  </div>

  <!-- Monster Manual -->
  <div class="download-box">
    <h2>Monster Manual</h2>
    <ul class="download-list">
      <li><a href="https://github.com/username/dnd4e-files/raw/main/Monster-Manual.pdf" target="_blank">Download PDF</a></li>
    </ul>
  </div>

  <!-- Character Sheet -->
  <div class="download-box">
    <h2>Character Sheet</h2>
    <ul class="download-list">
      <li><a href="https://github.com/username/dnd4e-files/raw/main/Character-Sheet.pdf" target="_blank">Download PDF</a></li>
    </ul>
  </div>

</div>

<script>
  fetch('navbar.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('navbar').innerHTML = data;
    });
</script>

</body>
</html>
